<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | REVA CampusConnect</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #253858, #f57c00);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-section img {
            width: 85px;
            height: 85px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .logo-section h1 {
            color: #253858;
            font-size: 25px;
            margin-bottom: 5px;
        }

        .logo-section p {
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #253858;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-box {
            position: relative;
        }

        .input-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #f57c00;
        }

        .input-box input {
            width: 100%;
            padding: 13px 15px 13px 45px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .input-box input:focus {
            border-color: #f57c00;
            box-shadow: 0 0 0 3px rgba(245, 124, 0, 0.1);
        }

        .login-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: #f57c00;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #e66f00;
            transform: translateY(-2px);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
        }

        .message.success {
            display: block;
            background: #e8f7ee;
            color: #1b7a3a;
        }

        .message.error {
            display: block;
            background: #fdeaea;
            color: #c62828;
        }

        .register-text {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 13px;
        }

        .register-text a {
            color: #f57c00;
            text-decoration: none;
            font-weight: 600;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            text-decoration: none;
            color: #253858;
            font-size: 14px;
            font-weight: 500;
        }

        .back-home a:hover {
            color: #f57c00;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 22px;
            }

            .logo-section h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo-section">

                <img src="images/reva-logo.png" alt="REVA University Logo">

                <h1>CampusConnect</h1>

                <p>Student Login</p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">Email Address</label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input type="email" id="email" placeholder="Enter your email" required>

                    </div>

                </div>


                <div class="form-group">

                    <label for="password">Password</label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input type="password" id="password" placeholder="Enter your password" required>

                    </div>

                </div>


                <button type="submit" class="login-btn" id="loginBtn">

                    <i class="fa-solid fa-right-to-bracket"></i>
                    Login

                </button>


                <div id="message" class="message">
                </div>

            </form>


            <div class="register-text">

                New student?

                <a href="register.html">
                    Create an account
                </a>

            </div>


            <div class="back-home">

                <a href="index.html">

                    <i class="fa-solid fa-arrow-left"></i>
                    Back to Home

                </a>

            </div>

        </div>

    </div>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const loginBtn =
            document.getElementById("loginBtn");

        const message =
            document.getElementById("message");


        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();


            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            message.className = "message";
            message.textContent = "";


            loginBtn.disabled = true;

            loginBtn.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin"></i> Logging in...';


            try {

                const response = await fetch(
                    "http://localhost:8080/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


                const result =
                    await response.text();


                if (response.ok) {

                    message.className =
                        "message success";

                    message.textContent =
                        result;

                    setTimeout(function () {

                        window.location.href =
                            "index.html";

                    }, 1200);

                } else {

                    message.className =
                        "message error";

                    message.textContent =
                        result;

                    loginBtn.disabled = false;

                    loginBtn.innerHTML =
                        '<i class="fa-solid fa-right-to-bracket"></i> Login';

                }


            } catch (error) {

                message.className =
                    "message error";

                message.textContent =
                    "Cannot connect to server. Please make sure the backend is running.";

                loginBtn.disabled = false;

                loginBtn.innerHTML =
                    '<i class="fa-solid fa-right-to-bracket"></i> Login';

            }


        });

    </script>

</body>

</html>
